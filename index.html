<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunnerCoach - Nhật ký tập luyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line { stroke: #f1f5f9; }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script>
        // Cấu hình Firebase đã được nhúng trực tiếp để chạy độc lập
        // Lưu ý: Các giá trị này được lấy từ môi trường hiện tại của ứng dụng
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'runner-coach-app';

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useMemo } = React;
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area,
            BarChart, Bar, Legend 
        } = Recharts;

        // Helper để hiển thị Icon của Lucide
        const Icon = ({ name, size = 20, className = "" }) => {
            return React.createElement('i', { 
                'data-lucide': name, 
                style: { width: size, height: size },
                className: `inline-block ${className}`
            });
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [formData, setFormData] = useState({ distance: '', pace: '', weight: '67', carbs: '', protein: '' });

            // Xác thực người dùng
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                    } else {
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await auth.signInWithCustomToken(__initial_auth_token);
                            } else {
                                await auth.signInAnonymously();
                            }
                        } catch (e) { console.error("Lỗi Auth:", e); }
                    }
                });
                return () => unsubscribe();
            }, []);

            // Lấy dữ liệu thời gian thực
            useEffect(() => {
                if (!user) return;
                const logsRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('logs');
                const unsubscribe = logsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const sorted = data.sort((a, b) => new Date(a.date) - new Date(b.date));
                    setHistory(sorted);
                    setLoading(false);
                    // Cập nhật lại icons sau khi render
                    setTimeout(() => lucide.createIcons(), 100);
                }, (err) => {
                    console.error("Lỗi Firestore:", err);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            useEffect(() => { lucide.createIcons(); }, [activeTab, loading]);

            const stats = useMemo(() => {
                if (history.length === 0) return { totalDist: 0, avgWeight: 67, lastPace: '--' };
                const totalDist = history.reduce((acc, curr) => acc + (Number(curr.distance) || 0), 0);
                const lastEntry = history[history.length - 1];
                return { totalDist: totalDist.toFixed(1), avgWeight: lastEntry.weight, lastPace: lastEntry.pace };
            }, [history]);

            const handleAddData = async (e) => {
                e.preventDefault();
                if (!formData.distance || !formData.weight) {
                    alert("Vui lòng nhập quãng đường và cân nặng!");
                    return;
                }
                setSubmitting(true);
                const newData = {
                    date: new Date().toISOString().split('T')[0],
                    distance: parseFloat(formData.distance) || 0,
                    pace: formData.pace || "0:00",
                    weight: parseFloat(formData.weight) || 67,
                    carbs: parseFloat(formData.carbs) || 0,
                    protein: parseFloat(formData.protein) || 0,
                    timestamp: Date.now()
                };
                try {
                    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('logs').add(newData);
                    setFormData({ ...formData, distance: '', pace: '', carbs: '', protein: '' });
                    setActiveTab('dashboard');
                } catch (err) { 
                    alert("Lỗi khi lưu: " + err.message); 
                }
                setSubmitting(false);
            };

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-slate-50">
                    <div className="text-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto mb-4"></div>
                        <p className="text-slate-500 font-medium">Đang kết nối dữ liệu Cloud...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-10">
                    <nav className="bg-white border-b sticky top-0 z-20 px-4 h-16 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2">
                            <div className="bg-orange-500 p-2 rounded-lg flex items-center justify-center text-white">
                                <Icon name="activity" size={20} />
                            </div>
                            <span className="font-extrabold text-xl tracking-tight">Runner<span className="text-orange-500">Coach</span></span>
                        </div>
                        <div className="flex gap-1 bg-slate-100 p-1 rounded-full">
                            <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${activeTab === 'dashboard' ? 'bg-white shadow-sm text-orange-600' : 'text-slate-500 hover:text-slate-700'}`}>TỔNG QUAN</button>
                            <button onClick={() => setActiveTab('log')} className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all ${activeTab === 'log' ? 'bg-white shadow-sm text-orange-600' : 'text-slate-500 hover:text-slate-700'}`}>GHI CHÉP</button>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto p-4 mt-4 space-y-6 animate-fade-in">
                        {activeTab === 'dashboard' ? (
                            <>
                                <div className="bg-white p-6 rounded-2xl border-l-4 border-orange-500 shadow-sm flex items-center gap-4">
                                    <div className="bg-orange-50 p-3 rounded-full flex items-center justify-center text-orange-600">
                                        <Icon name="award" size={24} />
                                    </div>
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-400 uppercase">Coach khuyên bạn</h4>
                                        <p className="font-semibold text-slate-700">Duy trì Pace 6:30 và bổ sung thêm tinh bột trước bài chạy dài nhé!</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <StatBox label="Tổng Km" value={`${stats.totalDist} km`} icon="map" color="blue" />
                                    <StatBox label="Cân nặng" value={`${stats.avgWeight} kg`} icon="trending-up" color="green" />
                                    <StatBox label="Pace cuối" value={stats.lastPace} icon="zap" color="orange" />
                                    <StatBox label="Ngày log" value={history.length} icon="calendar" color="purple" />
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                        <h3 className="font-bold text-sm mb-6 uppercase text-slate-400 tracking-widest flex items-center justify-between">
                                            Khối lượng chạy
                                            <span className="text-[10px] bg-orange-50 text-orange-600 px-2 py-0.5 rounded">Sơ đồ vùng</span>
                                        </h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <AreaChart data={history}>
                                                    <XAxis dataKey="date" hide />
                                                    <YAxis fontSize={10} axisLine={false} tickLine={false} stroke="#94a3b8" />
                                                    <Tooltip contentStyle={{borderRadius:'12px', border:'none', boxShadow:'0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                                    <Area type="monotone" dataKey="distance" stroke="#f97316" fill="#fff7ed" strokeWidth={3} />
                                                </AreaChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border shadow-sm">
                                        <h3 className="font-bold text-sm mb-6 uppercase text-slate-400 tracking-widest flex items-center justify-between">
                                            Cân nặng
                                            <span className="text-[10px] bg-green-50 text-green-600 px-2 py-0.5 rounded">Xu hướng</span>
                                        </h3>
                                        <div className="h-64">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <LineChart data={history}>
                                                    <XAxis dataKey="date" hide />
                                                    <YAxis domain={['dataMin - 1', 'dataMax + 1']} fontSize={10} axisLine={false} tickLine={false} stroke="#94a3b8" />
                                                    <Tooltip contentStyle={{borderRadius:'12px', border:'none', boxShadow:'0 10px 15px -3px rgb(0 0 0 / 0.1)'}} />
                                                    <Line type="monotone" dataKey="weight" stroke="#22c55e" strokeWidth={3} dot={{fill:'#22c55e', stroke:'#fff', strokeWidth:2, r:4}} activeDot={{r:6}} />
                                                </LineChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-xl border">
                                <div className="flex items-center gap-3 mb-8">
                                    <div className="p-3 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600">
                                        <Icon name="plus" size={24} />
                                    </div>
                                    <h2 className="text-2xl font-black">Ghi chép hôm nay</h2>
                                </div>
                                <form onSubmit={handleAddData} className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Km chạy được</label>
                                            <input type="number" step="0.1" className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-4 ring-orange-500/10 border border-slate-100 font-bold text-slate-700" placeholder="0.0" value={formData.distance} onChange={e => setFormData({...formData, distance: e.target.value})} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Pace trung bình</label>
                                            <input type="text" className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-4 ring-orange-500/10 border border-slate-100 font-bold text-slate-700" placeholder="6:30" value={formData.pace} onChange={e => setFormData({...formData, pace: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase ml-1">Cân nặng (kg)</label>
                                        <input type="number" step="0.1" className="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-4 ring-orange-500/10 border border-slate-100 font-bold text-slate-700" value={formData.weight} onChange={e => setFormData({...formData, weight: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-blue-500 uppercase">Tinh bột (g)</label>
                                            <input type="number" className="w-full bg-transparent text-2xl font-black outline-none text-blue-900 placeholder:text-blue-100" placeholder="0" value={formData.carbs} onChange={e => setFormData({...formData, carbs: e.target.value})} />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-bold text-red-500 uppercase">Chất đạm (g)</label>
                                            <input type="number" className="w-full bg-transparent text-2xl font-black outline-none text-red-900 placeholder:text-red-100" placeholder="0" value={formData.protein} onChange={e => setFormData({...formData, protein: e.target.value})} />
                                        </div>
                                    </div>
                                    <button className="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-black transition-all shadow-xl shadow-slate-200 active:scale-95 disabled:opacity-50" disabled={submitting}>
                                        {submitting ? "Đang gửi dữ liệu..." : "LƯU VÀO ĐÁM MÂY"}
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const StatBox = ({ label, value, icon, color }) => {
            const colors = {
                blue: 'bg-blue-50 text-blue-600 border-blue-100',
                green: 'bg-green-50 text-green-600 border-green-100',
                orange: 'bg-orange-50 text-orange-600 border-orange-100',
                purple: 'bg-purple-50 text-purple-600 border-purple-100',
            };
            return (
                <div className="bg-white p-5 rounded-2xl border shadow-sm hover:shadow-md transition-shadow">
                    <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-4 border ${colors[color]}`}>
                        <Icon name={icon} size={20} />
                    </div>
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">{label}</p>
                    <p className="text-xl font-black text-slate-800 tracking-tight">{value}</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
